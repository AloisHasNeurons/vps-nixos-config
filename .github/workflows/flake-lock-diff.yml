name: Flake lock diff summary

on:
  pull_request:
    paths:
      - flake.lock

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get pre-update flake.lock
        run: |
          git show "origin/${{ github.event.pull_request.base.ref }}:flake.lock" > /tmp/base-flake.lock

      - name: Build summary
        run: |
          chmod +x .github/scripts/flake-lock-diff.sh
          .github/scripts/flake-lock-diff.sh /tmp/base-flake.lock flake.lock | tee /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: flake-lock-diff
          path: /tmp/summary.md