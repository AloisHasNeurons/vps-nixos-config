name: "Manual Server Reboot"

on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  reboot:
    name: Reboot VPS
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # Configure & Cache Terraform Plugins
    - name: Configure Terraform Plugin Cache
      run: |
        mkdir -p ~/.terraform.d/plugin-cache
        echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

    - name: Cache Terraform Providers
      uses: actions/cache@v6
      with:
        path: ~/.terraform.d/plugin-cache
        key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/.terraform.lock.hcl') }}

    # Install Terraform to get the IP address dynamically, just like in deploy.yml
    - uses: hashicorp/setup-terraform@v4
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Get IP and Reboot Server
      run: |
        cd terraform
        SERVER_IP=$(terraform output -raw ipv4_address)
        cd ..
        
        echo "Rebooting $SERVER_IP..."
        
        # Pin the host key from the repo instead of trusting ssh-keyscan
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf 'Host *\n  StrictHostKeyChecking yes\n' >> ~/.ssh/config
        echo "$SERVER_IP $(cat secrets/vps-host-key.pub)" >> ~/.ssh/known_hosts

        # Issue the reboot command. We use || true because the SSH connection
        # is expected to drop abruptly when the server goes down.
        ssh -o BatchMode=yes deploy@$SERVER_IP "sudo reboot" || true

        echo "Reboot command sent successfully."
        echo "SERVER_IP=$SERVER_IP" >> "$GITHUB_ENV"

    - name: Verify Server After Reboot
      run: |
        bash .github/scripts/wait-for-reboot.sh "$SERVER_IP"
        bash .github/scripts/health-check.sh "$SERVER_IP"
