name: "CI - Terraform"

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/ci-terraform.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/ci-terraform.yml"

jobs:
  terraform-check:
    name: Terraform Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Configure Terraform Plugin Cache
      run: |
        mkdir -p ~/.terraform.d/plugin-cache
        echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

    - name: Cache Terraform Providers
      uses: actions/cache@v6
      with:
        path: ~/.terraform.d/plugin-cache
        key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/.terraform.lock.hcl') }}

    - uses: hashicorp/setup-terraform@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Build Go binaries for serverless monitoring
      run: |
        # Build AWS Lambda binary
        cd terraform/src/aws_health_check
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o bootstrap main.go
        cd ../../..

        # Build Azure Custom Handler binary
        cd terraform/src/azure_health_check
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o azure_handler main.go
        cd ../../..

    - name: Check Terraform Formatting
      run: terraform fmt -check -recursive

    - name: Terraform Validate
      run: |
        cd terraform
        terraform init -backend=false
        terraform validate

