name: "CI"

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  nix-check:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Run flake check
      run: nix flake check

  formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
    - name: Check format
      run: nix fmt -- . --check

  terraform-check:
    name: Terraform Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: hashicorp/setup-terraform@v4
    - name: Check Terraform Formatting
      run: terraform fmt -check -recursive
    - name: Terraform Validate
      run: |
        cd terraform
        terraform init -backend=false
        terraform validate

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  eval-check:
    name: Evaluate NixOS Config
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Evaluate system toplevel (dry-run)
      run: nix build .#nixosConfigurations.vps.config.system.build.toplevel --dry-run

  deadnix:
    name: Dead Code Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
    - name: Run deadnix
      run: nix run nixpkgs#deadnix -- --fail .

  lock-diff:
    name: Flake Lock Diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Show flake.lock changes
      run: |
        echo "### flake.lock diff" >> $GITHUB_STEP_SUMMARY
        echo '```diff' >> $GITHUB_STEP_SUMMARY
        git diff origin/${{ github.base_ref }} -- flake.lock >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
