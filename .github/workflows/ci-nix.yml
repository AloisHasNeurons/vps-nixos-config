name: "CI - Nix"

on:
  pull_request:
    paths:
      - "**/*.nix"
      - "flake.lock"
      - "justfile"
      - "tests/**"
      - "modules/**"
      - "secrets/**"
      - ".github/workflows/ci-nix.yml"
  # master/main are checked by deploy.yml, which calls this workflow before deploying
  workflow_call:

jobs:
  nix-check:
    # One runner per VM test: running them in parallel on a single runner is flaky.
    # Keep this list in sync with `checks` in flake.nix.
    name: Nix Check (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [security, services]
    steps:
    - uses: actions/checkout@v7
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v23
    - name: Cachix
      uses: cachix/cachix-action@v17
      with:
        name: ${{ vars.CACHIX_CACHE_NAME }}
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Run ${{ matrix.check }} check
      run: nix build -L --no-link .#checks.x86_64-linux.${{ matrix.check }}

  nix-lint-eval:
    name: Nix Lint & Eval
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v23
    - name: Cachix
      uses: cachix/cachix-action@v17
      with:
        name: ${{ vars.CACHIX_CACHE_NAME }}
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - name: Check Format
      run: nix fmt -- . --check
    - name: Run deadnix
      run: nix run nixpkgs#deadnix -- --fail .
    - name: Check flake outputs (no build)
      run: nix flake check --no-build
    - name: Evaluate system toplevel (dry-run)
      run: nix build .#nixosConfigurations.vps.config.system.build.toplevel --dry-run

  lock-diff:
    name: Flake Lock Diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Show flake.lock changes
      run: |
        echo "### flake.lock diff" >> $GITHUB_STEP_SUMMARY
        echo '```diff' >> $GITHUB_STEP_SUMMARY
        git diff origin/${{ github.base_ref }} -- flake.lock >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
